services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin@123
      POSTGRES_DB: leave_tracking
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:Admin@123@postgres:5432/leave_tracking
      DIRECT_URL: postgresql://postgres:Admin@123@postgres:5432/leave_tracking
      JWT_SECRET: c8f2a1e9d4b7f3c6a9e2d5b8f1c4a7e0d3b6f9c2a5e8d1b4f7c0a3e6d9b2f5c8
      JWT_REFRESH_SECRET: a3f6c9b2e5d8a1f4c7b0e3d6a9f2c5b8e1d4a7f0c3b6e9d2a5f8c1b4e7d0a3f6
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: development
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src   # hot reload
      - ./backend/prisma:/app/prisma

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html   # Vite needs index.html at root
      - ./frontend/public:/app/public

volumes:
  postgres_dev_data:
